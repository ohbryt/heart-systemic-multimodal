# ---------------------------------------------------------------------------
# Analysis Parameters
# ---------------------------------------------------------------------------
analysis:
  # Secretome analysis
  secretome:
    # Minimum fraction of cells expressing a gene to be considered
    min_expr_fraction: 0.05
    # Signal peptide prediction tool (signalp5, deepsig, or precomputed)
    signal_peptide_method: precomputed
    signal_peptide_db: data/reference/signal_peptide_genes.txt
    # Known secreted proteins database (UniProt/HPA)
    secreted_db: data/reference/secreted_proteins.txt

  # Ligand-receptor analysis
  ligand_receptor:
    method: cellchat   # cellchat | nichenet | liana
    min_cells_per_group: 10
    pvalue_threshold: 0.05
    top_n_interactions: 50

  # Cross-tissue overlap
  overlap:
    # Tissues to compare against heart
    comparison_tissues: ["liver", "skeletal_muscle", "adipose", "kidney"]
    # Minimum overlap score (Jaccard / Fisher) to report
    min_overlap_score: 0.1
    # Padj cutoff for differential expression in overlap analysis
    padj_cutoff: 0.05
    log2fc_cutoff: 1.0

  # Responder identification
  responders:
    # Cell types to prioritize (null = all)
    target_cell_types: null
    # Minimum correlation with heart fibrosis score
    min_correlation: 0.3
    # Methods: pearson, spearman, distance_corr
    correlation_method: spearman

  # Ranking / prioritization
  ranking:
    # Final output: top N candidates per category
    top_n: 20
    # Weights for composite score (must sum to 1.0)
    weights:
      scrna_score: 0.30
      proteomics_score: 0.25
      lr_score: 0.20
      cross_tissue_score: 0.15
      literature_score: 0.10

# ---------------------------------------------------------------------------
# Execution Parameters
# ---------------------------------------------------------------------------
execution:
  # Number of parallel workers (0 = use all available CPUs)
  n_workers: 4
  # Maximum RAM to use in GB (0 = unlimited)
  max_ram_gb: 0
  # Chunk size for large matrix operations
  chunk_size: 10000
  # Cache intermediate results to disk
  use_cache: true
  # Verbosity: DEBUG | INFO | WARNING | ERROR
  log_level: INFO
  # Write progress to a machine-readable JSON status file
  status_file: results/pipeline_status.json
