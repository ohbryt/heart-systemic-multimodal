# Heart-Systemic Multi-modal Analysis Pipeline — Default Configuration
# All paths are relative to the project root unless prefixed with /
# Override by passing --config <user_config.yaml> to any CLI command

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  data_dir: data/raw
  processed_dir: data/processed
  results_dir: results
  cache_dir: data/cache
  logs_dir: results/logs
  figures_dir: results/figures
  tables_dir: results/tables
  # Path to LR interaction database (e.g., CellChat, NicheNet, or custom TSV)
  # Columns expected: ligand, receptor, source, weight (optional)
  ligand_receptor_db: data/reference/lr_database.tsv

# ---------------------------------------------------------------------------
# Datasets
# ---------------------------------------------------------------------------
datasets:
  # ── Single-cell / Single-nucleus RNA-seq ─────────────────────────────────

  heart_cellxgene:
    type: scrna
    source: cellxgene_census
    # CELLxGENE Census collection ID for heart tissue
    collection_id: "283d65eb-dd53-496d-adb7-7570c7caa443"
    tissue_filter: ["heart", "heart left ventricle", "heart right ventricle"]
    disease_filter: ["normal", "dilated cardiomyopathy", "hypertrophic cardiomyopathy",
                     "heart failure", "ischemic cardiomyopathy"]
    # Set to null to disable census download and use local file instead
    local_fallback: data/raw/heart_cellxgene.h5ad
    enabled: true

  heart_failure_GSE183852:
    type: scrna
    source: geo
    accession: GSE183852
    description: "Human heart failure snRNA-seq — DCM/ICM vs healthy"
    local_path: data/raw/GSE183852
    url_template: "https://www.ncbi.nlm.nih.gov/geo/download/?acc={accession}&format=file"
    enabled: true

  cardiac_fibrosis_GSE135805:
    type: scrna
    source: geo
    accession: GSE135805
    description: "Human cardiac fibrosis scRNA-seq — fibroblast heterogeneity"
    local_path: data/raw/GSE135805
    url_template: "https://www.ncbi.nlm.nih.gov/geo/download/?acc={accession}&format=file"
    enabled: true

  heart_aging_GSE290577:
    type: scrna
    source: geo
    accession: GSE290577
    description: "Human aging heart scRNA-seq — age-related transcriptional drift"
    local_path: data/raw/GSE290577
    url_template: "https://www.ncbi.nlm.nih.gov/geo/download/?acc={accession}&format=file"
    enabled: true

  # ── Proteomics (PRIDE/PXD) ───────────────────────────────────────────────

  heart_proteomics_PXD021371:
    type: proteomics
    source: pride
    accession: PXD021371
    description: "Human heart failure plasma/tissue proteomics"
    local_path: data/raw/PXD021371
    file_pattern: "*.txt"
    sample_column: "Sample"
    protein_column: "Protein"
    intensity_column: "Intensity"
    enabled: true

  secretome_PXD059929:
    type: proteomics
    source: pride
    accession: PXD059929
    description: "Cardiac secretome — conditioned media proteomics"
    local_path: data/raw/PXD059929
    file_pattern: "*.txt"
    sample_column: "Sample"
    protein_column: "Protein"
    intensity_column: "Intensity"
    enabled: true

  cross_tissue_PXD060680:
    type: proteomics
    source: pride
    accession: PXD060680
    description: "Cross-tissue proteomics — heart/liver/muscle co-profiling"
    local_path: data/raw/PXD060680
    file_pattern: "*.txt"
    sample_column: "Sample"
    protein_column: "Protein"
    intensity_column: "Intensity"
    enabled: true

  # ── Bulk RNA-seq ──────────────────────────────────────────────────────────

  emtab_15659:
    type: bulk_rnaseq
    source: arrayexpress
    accession: E-MTAB-15659
    description: "Cross-tissue bulk RNA-seq — heart/liver/skeletal muscle"
    local_path: data/raw/E-MTAB-15659
    counts_file: "counts_matrix.tsv"
    metadata_file: "sample_metadata.tsv"
    enabled: true

  # ── Systemic Responder Datasets (placeholders — add paths when available) ─

  liver_responder:
    type: scrna
    source: local
    description: "Liver snRNA-seq from heart failure patients (custom cohort)"
    local_path: data/raw/liver_responder
    # Set enabled: true and provide local_path once data is available
    enabled: false
    notes: "PLACEHOLDER — replace with actual dataset path"

  muscle_responder:
    type: scrna
    source: local
    description: "Skeletal muscle snRNA-seq from heart failure patients (custom cohort)"
    local_path: data/raw/muscle_responder
    enabled: false
    notes: "PLACEHOLDER — replace with actual dataset path"

  custom_responder:
    type: scrna
    source: local
    description: "User-defined custom responder tissue dataset"
    local_path: data/raw/custom_responder
    enabled: false
    notes: "PLACEHOLDER — user-defined dataset"

# ---------------------------------------------------------------------------
# Preprocessing Parameters
# ---------------------------------------------------------------------------
preprocessing:
  # Minimum cells a gene must be expressed in to be retained
  min_cells: 3
  # Minimum genes detected per cell
  min_genes: 200
  # Maximum genes per cell (cells above this are flagged as doublets)
  max_genes: 8000
  # Maximum mitochondrial gene fraction
  max_mito_fraction: 0.20
  # Number of highly variable genes to select
  n_top_genes: 3000
  # Target cell count after downsampling (per dataset, null = no downsampling)
  downsample_to: 50000
  # Random seed for reproducibility
  random_seed: 42
  # Normalization target sum (library-size normalization)
  target_sum: 10000
  # Log-transform after normalization
  log1p: true
  # Leiden clustering resolution
  leiden_resolution: 0.5
  # Harmony batch correction key (null = skip)
  batch_key: "dataset"
  # UMAP parameters
  umap:
    n_neighbors: 15
    n_pcs: 30

