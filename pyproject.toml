[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "heart_systemic_multimodal"
version = "0.1.0"
description = "Multi-modal heart-systemic cross-tissue analysis pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Brown Biotech", email = "research@brownbiotech.com" },
]
keywords = ["single-cell", "transcriptomics", "proteomics", "heart", "fibrosis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    "requests>=2.31",
    "pyyaml>=6.0",
    "click>=8.1",
    "tqdm>=4.66",
    "rich>=13.7",
]

[project.optional-dependencies]
census = [
    "cellxgene-census>=1.13",
    "tiledb>=0.28",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.6",
    "ipykernel>=6.26",
    "jupyter>=1.0",
]
full = [
    "heart_systemic_multimodal[census,dev]",
]

[project.scripts]
hsm = "src.main:cli"

[project.urls]
Homepage = "https://github.com/brownbiotech/heart-systemic-multimodal"
Repository = "https://github.com/brownbiotech/heart-systemic-multimodal"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
